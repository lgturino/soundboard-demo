<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Soundboard</title>
    <style>
    body { max-width: 36rem; margin: 3rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    h1 { font-size: 1.5rem; }
    ul { padding-left: 1.25rem; }
    li { margin: .5rem 0; }
    button { font: inherit; cursor: pointer; }
    .remove-button { margin-left: .5rem; }
    .sound_box { border: 1px solid #888; border-radius: 8px; padding: 1rem; margin-top: 1rem; }
    audio { width: 100%; margin-top: 1rem; }
    </style>
    <script src="main.js" defer></script>
</head>
<body>
    <h1>Messy Audio Demo Prototype</h1>
    <form method="POST" id="getrand" action="/api/rand">
        <label for="audio_amount"> How many sounds? </label>
        <input type="number" id="audio_amount" name="val" min="1" required/>
        <input type="submit" value="Get Random"/>
    </form>

    <div id="audiolist"></div>


    <h1>Soundboard</h1>
    <audio id="player" controls hidden></audio>
    <p id="status">Loading audio files…</p>

    <form id="upload">
        <input type="file" name="file" accept=".mp3,audio/mpeg" required>
        <button type="submit">Upload MP3</button>
    </form>

    <ol id="files"></ol>

</body>
</html>
